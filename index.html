async function api(table,{method='GET',query='',body=null,prefer='return=representation'}={}){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,{
    method,
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json',
      Prefer:prefer
    },
    body:body===null?null:JSON.stringify(body)
  });
  if(!r.ok){
    let text=await r.text();
    throw new Error(`${r.status} ${text}`);
  }
  if(r.status===204)return null;
  const text=await r.text();
  return text?JSON.parse(text):null;
}

function dbToProduct(x){
  return {
    id:x.id,name:x.name,vendorId:x.vendor_id,categoryId:x.category_id,
    taxId:x.tax_id,net:Number(x.net_price),order:Number(x.display_order),
    active:Boolean(x.active),qty:Number(x.quantity||0)
  };
}
function productToDb(x){
  return {
    id:x.id,name:x.name,vendor_id:x.vendorId,category_id:x.categoryId,
    tax_id:x.taxId,net_price:Number(x.net),display_order:Number(x.order),
    active:Boolean(x.active),quantity:Number(x.qty||0),updated_at:new Date().toISOString()
  };
}

function lock(v){

}
async function runCloud(fn,success){
  if(busy)return;
  lock(true);
  try{
    await fn();
    await loadCloud();
    if(success)msg(success);
  }catch(e){
    console.error(e);
    msg('保存できませんでした');
    setCloud('保存エラー','err');
  }finally{

  }
}

function isoDate(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function fmtQty(n){return Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2})}

function nthMonday(year,month,n){
  const first=new Date(year,month-1,1);
  const offset=(8-first.getDay())%7;
  return 1+offset+(n-1)*7;
}
function vernalEquinoxDay(year){
  return Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4));
}
function autumnEquinoxDay(year){
  return Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4));
}
function buildJapaneseHolidays(year){
  const h=new Map();
  const add=(month,day,name)=>h.set(isoDate(year,month-1,day),name);

  add(1,1,'元日');
  add(1,nthMonday(year,1,2),'成人の日');
  add(2,11,'建国記念の日');
  if(year>=2020)add(2,23,'天皇誕生日');
  add(3,vernalEquinoxDay(year),'春分の日');
  add(4,29,'昭和の日');
  add(5,3,'憲法記念日');
  add(5,4,'みどりの日');
  add(5,5,'こどもの日');
  add(7,nthMonday(year,7,3),'海の日');
  if(year>=2016)add(8,11,'山の日');
  add(9,nthMonday(year,9,3),'敬老の日');
  add(9,autumnEquinoxDay(year),'秋分の日');
  add(10,nthMonday(year,10,2),'スポーツの日');
  add(11,3,'文化の日');
  add(11,23,'勤労感謝の日');

  // 国民の休日：祝日に挟まれた平日
  for(let month=0;month<12;month++){
    const last=new Date(year,month+1,0).getDate();
    for(let day=2;day<last;day++){
      const key=isoDate(year,month,day);
      if(h.has(key))continue;
      const prev=new Date(year,month,day-1);
      const next=new Date(year,month,day+1);
      const prevKey=isoDate(prev.getFullYear(),prev.getMonth(),prev.getDate());
      const nextKey=isoDate(next.getFullYear(),next.getMonth(),next.getDate());
      if(h.has(prevKey)&&h.has(nextKey))h.set(key,'国民の休日');
    }
  }

  // 振替休日：日曜の祝日の次の非祝日
  [...h.keys()].sort().forEach(key=>{
    const dt=new Date(key+'T00:00:00');
    if(dt.getDay()!==0)return;
    let sub=new Date(dt);
    do{sub.setDate(sub.getDate()+1)}
    while(h.has(isoDate(sub.getFullYear(),sub.getMonth(),sub.getDate())));
    h.set(isoDate(sub.getFullYear(),sub.getMonth(),sub.getDate()),'振替休日');
  });

  return h;
}
function localTodayISO(){
  const d=new Date();
  return isoDate(d.getFullYear(),d.getMonth(),d.getDate());
}

  deliveryCount.textContent=monthly.filter(r=>r.type==='delivery'&&(!vendorFilter||r.vendorId===vendorFilter)).length+'件';

  const map=new Map();
  monthly.forEach(r=>{
    const k=r.item+'__'+r.unit;
    if(!map.has(k))map.set(k,{item:r.item,unit:r.unit,prep:0,delivery:0,history:[]});
    const s=map.get(k);
    if(r.type==='prep')s.prep+=r.qty;
    if(r.type==='delivery'&&(!vendorFilter||r.vendorId===vendorFilter)){
      s.delivery+=r.qty;
      s.history.push(r);
    }
  });

  const summaries=[...map.values()]
    .filter(s=>s.prep>0||s.delivery>0)
    .sort((a,b)=>a.item.localeCompare(b.item,'ja'));

  prepSummary.innerHTML=summaries.length?summaries.map(s=>{
    const history=s.history.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>{
      const dt=new Date(r.date+'T00:00:00');
      return `<div class='history-row'><span class='history-date'>${dt.getMonth()+1}/${dt.getDate()}</span><span class='history-vendor'>${esc(vn(r.vendorId))}</span><span class='history-qty'>${fmtQty(r.qty)}${esc(r.unit)}</span></div>`;
    }).join('');
    const remaining=s.prep-s.delivery;return `<div class='summary-item'><div class='summary-name'>${esc(s.item)}</div><div class='summary-grid'><div class='prep-stat'>仕込み<b>${fmtQty(s.prep)}${esc(s.unit)}</b></div><div class='delivery-stat'>納品<b>${fmtQty(s.delivery)}${esc(s.unit)}</b></div><div class='remaining-stat ${remaining<0?'minus':''}'>残り<b>${fmtQty(remaining)}${esc(s.unit)}</b></div></div><div class='history-title'>納品履歴</div>${history?`<div class='history-list'>${history}</div>`:`<div class='history-empty'>納品履歴はありません</div>`}</div>`;
  }).join(''):`<div class='empty'>今月の記録はありません</div>`;

  const items=[...new Set(prepRecords.map(r=>r.item).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));prepItems.innerHTML=items.map(x=>`<option value='${esc(x)}'>`).join('');
  prepCal.innerHTML='';
  const first=(new Date(y,mo,1).getDay()+6)%7,last=new Date(y,mo+1,0).getDate();
  const holidays=buildJapaneseHolidays(y);
  const today=localTodayISO();
  for(let i=0;i<first;i++)prepCal.insertAdjacentHTML('beforeend','<div></div>');
  for(let d=1;d<=last;d++){
    const date=isoDate(y,mo,d);
    const rs=prepRecords.filter(r=>r.date===date);
    const pc=rs.filter(r=>r.type==='prep').length;
    const dc=rs.filter(r=>r.type==='delivery').length;
    const weekday=new Date(y,mo,d).getDay();
    const holidayName=holidays.get(date)||'';
    const isToday=date===today;
    const classes=['day'];
    if(rs.length)classes.push('has');
    if(weekday===0||weekday===6)classes.push('weekend');
    if(holidayName)classes.push('holiday');
    if(isToday)classes.push('today');

    const b=document.createElement('button');
    b.className=classes.join(' ');
    b.title=holidayName||'';
    b.innerHTML=`<div class='day-top'><span class='day-num'>${d}</span><span>${holidayName?`<i class='holiday-badge'>祝</i>`:''}${isToday?`<i class='today-badge'>本日</i>`:''}</span></div><div class='day-mark'>${pc?`<b class='prep-mark'>仕${pc}</b>`:''}${dc?`<b class='delivery-mark'>納${dc}</b>`:''}</div>`;
    b.onclick=()=>openDay(date);
    prepCal.appendChild(b);
  }
}

function openDay(date){selectedPrepDate=date;const rs=prepRecords.filter(r=>r.date===date);const dt=new Date(date+'T00:00:00');dayTitle.textContent=`${dt.getMonth()+1}月${dt.getDate()}日の記録`;dayBody.innerHTML=rs.length?rs.map(r=>`<div class='record-card'><div class='record-top'><div><div class='record-type ${r.type==='prep'?'prep-type':'delivery-type'}'>${r.type==='prep'?'仕込み':'納品'}</div><div class='record-name'>${esc(r.item)}</div><div class='record-sub'>${r.type==='delivery'?esc(vn(r.vendorId))+'・':''}${fmtQty(r.qty)}${esc(r.unit)}${r.memo?'・'+esc(r.memo):''}</div></div><div class='record-actions'><button onclick="openRecord('${r.date}','${r.id}')">編集</button><button class='danger' onclick="deleteRecord('${r.id}','${r.date}')">削除</button></div></div></div>`).join(''):`<div class='empty'>この日の記録はありません</div>`;openS(daySheet)
}
async function deleteRecord(id,date){if(!confirm('この記録を削除しますか？'))return;closeS();await runCloud(()=>api('preparation_records',{method:'DELETE',query:`?id=eq.${encodeURIComponent(id)}`,prefer:'return=minimal'}),'削除しました');openDay(date)}

form.onsubmit=async e=>{
  e.preventDefault();
  const x=p.find(y=>y.id===eid.value);
  const d={id:x?.id||nextId('P',p),name:pn.value.trim(),vendorId:pv.value,categoryId:pc.value,taxId:pt.value,net:Number(pp.value),order:Number(po.value),active:sw.dataset.on==='1',qty:x?.qty||0};

mform.onsubmit=async e=>{
  e.preventDefault();
  masterType=mtype.value;
  const c=masterConfig[masterType],rows=masterRows(),old=rows.find(x=>x.id===mid.value),value=mvalue.value.trim();
  if(!value)return msg('入力してください');
  let body;
  if(masterType==='tax'){
    const rate=Number(value);if(Number.isNaN(rate)||rate<0||rate>100)return msg('0〜100で入力してください');
    body={id:old?.id||nextId(c.prefix,rows),rate,display_order:old?.order||Math.max(0,...rows.map(x=>x.order||0))+1,active:true};
  }else{
    body={id:old?.id||nextId(c.prefix,rows),name:value,display_order:old?.order||Math.max(0,...rows.map(x=>x.order||0))+1,active:true};
    if(masterType==='vendor'){
      if(!muPurchase.checked&&!muDelivery.checked&&!muSelf.checked)return msg('仕入・納品・自社のどれかを選択してください');
      body.is_purchase=muPurchase.checked;
      body.is_delivery=muDelivery.checked;
      body.is_self=muSelf.checked;
    }
  }
  closeS();
  await runCloud(()=>api(c.table,{method:old?'PATCH':'POST',query:old?`?id=eq.${encodeURIComponent(old.id)}`:'',body,prefer:old?'return=minimal':'return=representation'}),old?'更新しました':'追加しました');
};


recordForm.onsubmit=async e=>{

};

installBtn.onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;

  installBtn.classList.remove('show');
};
